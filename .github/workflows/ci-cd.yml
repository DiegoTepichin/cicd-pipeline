name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN
permissions:
  contents: read

env:
  IMAGE_NAME: diegotepichin/cicd-pipeline

jobs:
  quality-gates:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & format check (Ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: SAST (Bandit)
        run: bandit -r app/

      - name: Unit tests + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-scan-push:
    name: Build, scan & publish image
    needs: [quality-gates, dockerfile-lint]
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in step `if:` directly; expose a boolean instead
      HAS_REGISTRY_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (runner target)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test container health
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE_NAME:${{ github.sha }}"
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_REGISTRY_CREDS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_REGISTRY_CREDS == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Skip publish notice
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_REGISTRY_CREDS != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured — image built and scanned but not pushed."

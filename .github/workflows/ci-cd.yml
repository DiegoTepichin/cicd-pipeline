name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the GITHUB_TOKEN
permissions:
  contents: read

env:
  # GHCR requires lowercase image names
  IMAGE_NAME: ghcr.io/diegotepichin/cicd-pipeline

# Every action is pinned to a full commit SHA (tags are mutable).
# Dependabot keeps the SHAs and the version comments up to date.
jobs:
  quality-gates:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint & format check (Ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: SAST (Bandit)
        run: bandit -r app/

      - name: Unit tests + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  dockerfile-lint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  # Pull requests: build, smoke test and scan the image locally. Nothing is pushed.
  image-check:
    name: Build & scan image
    if: github.event_name == 'pull_request'
    needs: [quality-gates, dockerfile-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (runner target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test container health
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # Push to main: build the multi-arch image once and push it by digest only (untagged).
  # The gates below run against that exact digest, which is then signed and only
  # afterwards tagged. A tag never points at an image that skipped a gate.
  publish:
    name: Build, scan, sign & publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gates, dockerfile-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write # OIDC token for keyless Cosign signing
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push by digest (untagged)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          # amd64 for servers, arm64 for Apple Silicon and Graviton
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-platform SPDX SBOM (BuildKit's Syft scanner) and SLSA provenance,
          # stored as attestations inside the image index
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Links the package to this repository on GitHub
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Smoke test container health
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Vulnerability scan (Trivy, linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Vulnerability scan (Trivy, linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Trivy is already installed by the previous step
          skip-setup-trivy: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore)
        # --recursive also signs each platform manifest and its attestations
        run: cosign sign --yes --recursive "$IMAGE_NAME@${{ steps.build.outputs.digest }}"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1

      - name: Promote digest to :sha and :latest
        # crane tag points the tag at the existing manifest without rewriting it,
        # so the tagged digest is exactly the one that was scanned and signed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          crane tag "$IMAGE_NAME@$DIGEST" "${{ github.sha }}"
          crane tag "$IMAGE_NAME@$DIGEST" latest
          echo "Published $IMAGE_NAME@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
